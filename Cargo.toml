[package]
name = "qwen3-tts"
version = "0.3.0"
edition = "2021"
description = "Pure Rust inference for Qwen3-TTS"
license = "MIT"
autobenches = false

[features]
default = ["cpu"]
cpu = []
cli = ["clap", "indicatif"]
hub = ["hf-hub"]

# All platform-portable features. Use `cargo lint` / `cargo check-all` / `cargo test-all`
# instead of --all-features (which fails because platform-specific features conflict).
all-portable = ["cpu", "cli", "hub"]

# Platform-specific — enable manually based on your hardware:
#   macOS:         metal, accelerate
#   Linux + Intel: mkl
#   Linux + NVIDIA: cuda, flash-attn
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
flash-attn = ["cuda", "dep:candle-flash-attn"]
profiling = ["dep:tracing-chrome"]

[dependencies]
# Candle ML framework
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
candle-flash-attn = { version = "0.10.2", optional = true }

# Tokenization (HuggingFace tokenizers in Rust)
tokenizers = "0.23.1"

# Audio processing
hound = "3.5.1"              # WAV I/O
rubato = "3.0.0"            # High-quality resampling
rustfft = "6.4.1"            # FFT for spectrograms

# Serialization & model loading
safetensors = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Utilities
anyhow = "1.0.102"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rayon = "1.12.0"             # Parallel CPU processing
byteorder = "1.5.0"
num-traits = "0.2.19"
num-complex = "0.4.6"

# CLI (optional)
clap = { version = "4.6.1", features = ["derive"], optional = true }
indicatif = { version = "0.18.4", optional = true }

# HuggingFace Hub (optional) - uses ureq sync client, no OpenSSL needed
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"], optional = true }
audioadapter-buffers = "3.0.0"

# Profiling (optional)
tracing-chrome = { version = "0.7.2", optional = true }
half = "2.7.1"

[dev-dependencies]
criterion = "0.8.2"
approx = "0.5.1"
tempfile = "3.27.0"
ndarray = "0.17.2"
ndarray-npy = "0.10.0"

[[bin]]
name = "generate_audio"
path = "src/bin/generate_audio.rs"
required-features = ["cli"]

[[bench]]
name = "sampling"
harness = false

[[bench]]
name = "audio"
harness = false

[[bench]]
name = "tensor_ops"
harness = false

[[bin]]
name = "e2e_bench"
path = "benches/e2e_bench.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
lto = false
